
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPAY | UPI Payment</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:grid;place-items:center;
padding:20px;font-family:Arial,sans-serif;
background:linear-gradient(135deg,#101827,#203b55);
color:#fff}
.card{
width:100%;max-width:420px;padding:28px 22px;
border:1px solid #40516a;border-radius:22px;
background:#17263b;box-shadow:0 18px 50px #0006}
.brand{text-align:center;font-size:30px;font-weight:bold;letter-spacing:5px}
.sub{text-align:center;color:#b6c5d6;font-size:11px;letter-spacing:2px;margin-top:8px}
.amount{text-align:center;font-size:42px;font-weight:bold;margin:28px 0 5px}
.caption{text-align:center;color:#aab8ca;font-size:12px}
.line{height:1px;background:#40516a;margin:24px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:14px}
.key{color:#aab8ca}.value{text-align:right;font-weight:bold;overflow-wrap:anywhere}
.pay{display:block;text-align:center;text-decoration:none;
background:#b9f3d6;color:#09251a;font-weight:bold;
padding:17px 10px;border-radius:13px;margin-top:24px}
.note{text-align:center;color:#aab8ca;font-size:11px;line-height:1.6;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<div class="brand">REPAY</div>
<div class="sub">UPI PAYMENT REQUEST</div>
<div class="amount">₹4,300.00</div>
<div class="caption">FIXED PAYMENT AMOUNT · INR</div>
<div class="line"></div>
<div class="row"><span class="key">Recipient</span><span class="value">Anshu Aman Singh</span></div>
<div class="row"><span class="key">UPI ID</span><span class="value">anshuamansingh@fam</span></div>
<div class="row"><span class="key">Payment method</span><span class="value">UPI Apps</span></div>
<a class="pay" href="upi://pay?pa=anshuamansingh%40fam&amp;pn=Anshu%20Aman%20Singh&amp;am=4300.00&amp;cu=INR&amp;tn=REPAY">➜ TAP HERE TO PAY ₹4,300</a>
<div class="note">Please verify the recipient name and amount in your UPI app before confirming payment.<br>REPAY · UPI Payment Request</div>
</div>
</body>
</html>
